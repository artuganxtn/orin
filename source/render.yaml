services:
  - type: web
    name: orin-backend
    runtime: node
    plan: starter
    region: oregon
    rootDir: source/firebase-functions
    buildCommand: npm --prefix .. run build:firebase && npm install && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        sync: false
      - key: KYC_HMAC_SECRET
        sync: false
      - key: KYC_FILES_KEY
        sync: false
      - key: FIREBASE_PROJECT
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ORIN_DEPOSITS_ENABLED
        sync: false
      - key: ORIN_NOWPAYMENTS_API_KEY
        sync: false
      - key: ORIN_NOWPAYMENTS_IPN_SECRET
        sync: false
      - key: ORIN_PAYMENTS_CALLBACK_URL
        sync: false
      - key: ORIN_SECURITY_MASTER_KEY
        sync: false
      - key: ORIN_ACCOUNT_SECURITY_ENABLED
        sync: false
      - key: ORIN_WEBAUTHN_ORIGIN
        sync: false
      - key: ORIN_WEBAUTHN_RP_ID
        sync: false
      - key: ORIN_EMAIL_CODES_ENABLED
        sync: false
      - key: ORIN_EMAIL_CODE_SECRET
        sync: false
      - key: ORIN_MAIL_API_KEY
        sync: false
      - key: ORIN_MAIL_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: TITAN_PASSWORD
        sync: false
      - key: ORIN_SUPPORT_AI_ENABLED
        sync: false
      - key: ORIN_SUPPORT_AI_PROVIDER
        sync: false
      - key: ORIN_SUPPORT_AI_MODEL
        sync: false
      - key: ORIN_SUPPORT_AI_TOKEN
        sync: false
      - key: ORIN_SUPPORT_AI_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHANNEL_ID
        sync: false
      - key: TELEGRAM_TEST_CHANNEL_ID
        sync: false
      - key: TELEGRAM_AUTO_POST_ENABLED
        sync: false
      - key: TELEGRAM_MODE
        sync: false
