services:
  - type: web
    name: orin-trader
    env: node
    region: singapore
    plan: starter
    buildCommand: "npm --prefix source run build:render && npm --prefix source/firebase-functions run build"
    startCommand: "node source/firebase-functions/lib/index.js"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: ORIN_MAIL_FROM
        value: support@javl900.com
      - key: SMTP_HOST
        value: smtp.titan.email
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        value: support@javl900.com

  - type: cron
    name: orin-daily-reminders
    env: node
    region: singapore
    schedule: "0 9 * * *"
    buildCommand: "npm --prefix source/firebase-functions run build"
    startCommand: "node source/scripts/send-daily-reminders.mjs"
